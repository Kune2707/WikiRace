spring.application.name=wikirace
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wikirace}
spring.datasource.username=${DATABASE_USER:wikirace}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.port=${PORT:8080}
app.game.action-record-capacity=${ACTION_RECORD_CAPACITY:2048}
app.game.movement-per-second=${MOVEMENT_PER_SECOND:10}
app.game.lobby-grace=${LOBBY_GRACE:5m}
app.game.finished-retention=${FINISHED_RETENTION:30m}
app.game.cleanup-millis=${ROOM_CLEANUP_MILLIS:10000}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
spring.jackson.mapper.allow-coercion-of-scalars=false
app.wikipedia.user-agent=${WIKIPEDIA_USER_AGENT:WikiRace/0.0.1 (local development)}
app.wikipedia.connect-timeout=${WIKIPEDIA_CONNECT_TIMEOUT:3s}
app.wikipedia.load-timeout=${WIKIPEDIA_LOAD_TIMEOUT:10s}
app.wikipedia.cache-size=${WIKIPEDIA_CACHE_SIZE:500}
app.wikipedia.cache-ttl=${WIKIPEDIA_CACHE_TTL:30m}
app.wikipedia.max-response-bytes=${WIKIPEDIA_MAX_RESPONSE_BYTES:8388608}

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp test
      - run: ./mvnw -B -ntp -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package offline browser-test backend
        run: chmod +x ../backend/mvnw && ../backend/mvnw -f ../backend/pom.xml -B -ntp -Dmaven.test.skip=true package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_PORT: '8090'
      COMPOSE_PROJECT_NAME: wikirace-ci
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate ephemeral database credential
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: node scripts/verify-compose.mjs http://localhost:8090
      - name: Stack diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=100
      - name: Remove ephemeral CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
